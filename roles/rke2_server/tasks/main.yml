---

- name: Download RKE2 and apply workaround
  include_role:
    name: rke2_common

- name: Install RKE2
  become: true
  shell: >
    INSTALL_RKE2_CHANNEL={{ rke2.version }} INSTALL_RKE2_TYPE=server INSTALL_RKE2_METHOD=tar /tmp/rke2_installer.sh
  register: rke2_install_result
  retries: 5
  delay: 10
  until: rke2_install_result.rc == 0

- name: Ensure RKE2 config directory exists
  become: true
  file:
    path: /etc/rancher/rke2
    state: directory

- name: Generate RKE2 server config
  become: true
  template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
  notify: Restart rke2-server   # only notify if the file changed

- name: Start and enable rke2-server
  become: true
  systemd:
    name: rke2-server
    enabled: true
    state: started
  retries: 3
  delay: 30

- name: Create .kube directory
  ansible.builtin.file:
    path: ~/.kube
    state: directory
    mode: '0750'

- name: Copy .kube/config
  copy:
    src: /etc/rancher/rke2/rke2.yaml
    dest: "~/.kube/config"
    remote_src: true
    mode: '0600'
  register: copy_result
  until: copy_result is succeeded
  retries: 10
  delay: 30

- name: Add /usr/local/bin,/var/lib/rancher/rke2/bin and ~/bin to PATH
  lineinfile:
    path: ~/.bashrc
    line: export PATH="/usr/local/bin:/var/lib/rancher/rke2/bin:~/bin:$PATH"

- name: Fetch direct kubeconfig (bypasses Rancher proxy, needed for isvctl tests)
  when: inventory_hostname == groups['rke2_servers'][0]
  block:
    - name: Read rke2.yaml from server
      become: true
      slurp:
        src: /etc/rancher/rke2/rke2.yaml
      register: _rke2_kubeconfig_raw

    - name: Write kubeconfig with direct server address to control node
      delegate_to: localhost
      copy:
        content: "{{ _rke2_kubeconfig_raw.content | b64decode | replace('https://127.0.0.1:6443', 'https://' + (rke2.lb_address | default(hostvars[groups['rke2_servers'][0]].ansible_host, true)) + ':6443') }}"
        dest: "{{ playbook_dir }}/../kubeconfig-rke2-direct.yaml"
        mode: '0600'
