---

- name: List configured repositories
  become: true
  ansible.builtin.command:
    argv:
      - zypper
      - --non-interactive
      - --xmlout
      - lr
  register: zypper_repo_list
  changed_when: false

- name: Enable SCC-backed NVIDIA repositories
  # On registered SLES 16+ the NVIDIA repos exist but are disabled by default;
  # enable them so their packages become the preferred source (avoids falling
  # back to the external developer.download.nvidia.com CUDA repo).
  become: true
  ansible.builtin.command:
    argv:
      - zypper
      - --non-interactive
      - modifyrepo
      - --enable
      - "{{ item }}"
  loop: "{{ zypper_repo_list.stdout | regex_findall('alias=\"([^\"]+)\"') | select('search', nvidia_scc_repo_pattern) | list }}"
  changed_when: "'has been successfully enabled' in modifyrepo_result.stdout"
  register: modifyrepo_result

- name: Refresh package repositories
  become: true
  ansible.builtin.command:
    argv:
      - zypper
      - --non-interactive
      # Import repo signing keys automatically. The freshly-enabled SCC NVIDIA
      # repos are GPG-checked; without this, --non-interactive declines the
      # unknown key, the repo never refreshes, and the package check below
      # wrongly concludes the driver packages are unavailable.
      - --gpg-auto-import-keys
      - refresh
  changed_when: false
  # Don't abort if an unrelated repo is temporarily unreachable or misconfigured;
  # the package availability check below is what actually gates the CUDA repo.
  failed_when: false

- name: Check whether required NVIDIA packages are already available
  become: true
  ansible.builtin.command:
    argv:
      - zypper
      - --non-interactive
      - search
      - --match-exact
      - --type
      - package
      - "{{ item }}"
  loop: "{{ nvidia_packages }}"
  register: nvidia_package_check
  changed_when: false
  failed_when: false

- name: Determine whether to add the NVIDIA CUDA repo
  # Add the CUDA repo only if a required package is not already provided by a
  # configured repo (e.g. the SCC-backed NVIDIA repo on registered SLES 16+).
  set_fact:
    add_nvidia_repo: >-
      {{
        nvidia_package_check.results
        | selectattr('rc', 'ne', 0)
        | list
        | length > 0
      }}


# Install the nvidia driver packages on the servers that has GPU.

- name: Construct cuda url
  set_fact:
    construct_cuda_url: >-
      {% set arch = 'sbsa' if ansible_facts['architecture'] == 'aarch64' else ansible_facts['architecture'] %}
      {% set distro = ansible_facts['distribution'] %}
      {% set major_version = ansible_facts['distribution_major_version'] %}
      {% set base = 'https://developer.download.nvidia.com/compute/cuda/repos' %}

      {% if distro in ['openSUSE Leap', 'openSUSE Tumbleweed'] %}
      {{ base }}/opensuse{{ major_version }}/{{ arch }}/

      {% elif distro == 'openSUSE Leap Micro' %}
      {% set ver = '15' if major_version == '6' else major_version %}
      {{ base }}/opensuse{{ ver }}/{{ arch }}/

      {% elif distro == 'SLES' %}
      {{ base }}/{{ 'suse16' if major_version == '16' else 'sles15' }}/{{ arch }}/

      {% elif distro == 'SL-Micro' %}
      {% set ver = '15' if major_version == '6' else major_version %}
      {{ base }}/sles{{ ver }}/{{ arch }}/

      {% else %}
      unsupported
      {% endif %}
  when: add_nvidia_repo | bool

- name: Set cuda_repo_url
  set_fact:
    cuda_repo_url: "{{ construct_cuda_url | trim }}"
  when: add_nvidia_repo | bool

- name: Display cuda_repo_url
  debug:
    msg: "{{ cuda_repo_url }}"
  when: add_nvidia_repo | bool

- name: Check if CUDA repo URL is reachable
  uri:
    url: "{{ cuda_repo_url }}"
    method: HEAD
    return_content: no
    status_code: 200
    timeout: 10
  register: cuda_repo_check
  failed_when: cuda_repo_check.status | default(0) != 200
  changed_when: false
  when: add_nvidia_repo | bool

- name: Fail if CUDA repo URL is not reachable
  fail:
    msg: "CUDA repo URL {{ cuda_repo_url }} is not reachable!"
  when:
  - add_nvidia_repo | bool
  - cuda_repo_check is failed

- name: Add a package repository from NVIDIA
  become: true
  community.general.zypper_repository:
    name: cuda
    repo: "{{cuda_repo_url}}"
    state: present
    auto_import_keys: true
    runrefresh: true
  when: add_nvidia_repo | bool

- name: Check for GPU using lspci
  become: true
  command: lspci
  register: lspci_out

- name: Determine if GPU is present
  set_fact:
    has_gpu: "{{ lspci_out.stdout is search('VGA compatible controller.*NVIDIA|3D controller.*NVIDIA', ignorecase=True) }}"

- name: Check if nvidia-smi is working
  become: true
  ansible.builtin.shell: nvidia-smi
  register: nvidia_smi_result
  changed_when: false
  failed_when: false
  when: has_gpu | default(false)

- name: Read os-release info
  shell: |
    source /etc/os-release
    echo $ID
  register: osid

- name: Set driver package variables
  set_fact:
    #package_name: "{{ 'nv-prefer-signed-open-driver' if osid.stdout == 'sles' else 'nvidia-open-driver-G07-signed-cuda-kmp-default' }}"
    package_name: "nvidia-open-driver-G07-signed-cuda-kmp-default"
    fallback_driver_version: "{{ fallback_driver_version_sles if osid.stdout == 'sles' else fallback_driver_version_sle_micro }}"

- name: Display the package name
  debug:
    msg: "{{ package_name }}"

# Install the latest NVIDIA graphic driver packages when the target host has Nvidia GPU
- name: Install NVIDIA driver package (latest)
  become: true
  block:
    - name: Install latest version
      shell: >
        {% if ansible_facts['distribution'] == 'SL-Micro' %}
        transactional-update --continue --quiet run bash -c "zypper in -y --auto-agree-with-licenses {{ package_name }}"
        {% else %}
        bash -c "zypper in -y --auto-agree-with-licenses {{ package_name }}"
        {% endif %}
      register: install_package_result

    - name: Get installed version of package
      shell: >
        {% if ansible_facts['distribution'] == 'SL-Micro' %}
        transactional-update --continue --quiet run bash -c "rpm -qa --queryformat '%{VERSION}\n' {{ package_name }} | cut -d '_' -f1 | sort -u | tail -n 1"
        {% else %}
        bash -c "rpm -qa --queryformat '%{VERSION}\n' {{ package_name }} | cut -d '_' -f1 | sort -u | tail -n 1"
        {% endif %}
      register: query_result
      failed_when: query_result.rc != 0 or query_result.stdout == ""

    - name: Set latest_version
      set_fact:
        latest_version: "{{ query_result.stdout }}"

    - name: Display latest_version
      debug:
        msg: "{{ package_name }} latest version is {{ latest_version }}"

    # nvidia-container-toolkit is installed below and needs a source. On
    # SCC-enabled SLES 16+ it is already provided by NVIDIA-GPU-Compute-Toolkit-CUDA,
    # so only add the external GitHub repo when the package isn't already available.
    - name: Check whether nvidia-container-toolkit is already available
      become: true
      ansible.builtin.command:
        argv:
          - zypper
          - --non-interactive
          - search
          - --match-exact
          - --type
          - package
          - nvidia-container-toolkit
      register: container_toolkit_check
      changed_when: false
      failed_when: false

    - name: Check if nvidia-container-toolkit.repo exists
      stat:
        path: /etc/zypp/repos.d/nvidia-container-toolkit.repo
      register: nvidia_container_toolkit_repo_file
      when: container_toolkit_check.rc != 0

    - name: Add container toolkit repo for validation
      shell:
        zypper ar --refresh -G https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo
      when:
      - container_toolkit_check.rc != 0
      - not nvidia_container_toolkit_repo_file.stat.exists

    - name: Install nvidia-container-toolkit
      ansible.builtin.zypper:
        name: nvidia-container-toolkit
        disable_gpg_check: true
        state: present

    - name: Install latest package nvidia-compute-utils-G07 and nvidia-gl-G07
      shell: >
        {% if ansible_facts['distribution'] == 'SL-Micro' %}
        transactional-update --continue --quiet run bash -c "zypper in -y --auto-agree-with-licenses nvidia-compute-utils-G07={{ latest_version }} nvidia-gl-G07={{ latest_version }}"
        {% else %}
        bash -c "zypper in -y --auto-agree-with-licenses nvidia-compute-utils-G07={{ latest_version }} nvidia-gl-G07={{ latest_version }}"
        {% endif %}
      register: nvidia_install
  when:
    - has_gpu | default(false)

- name: Handle fallback if latest version install fails
  become: true
  block:
    - name: Remove broken driver package
      ansible.builtin.zypper:
        name: "{{ package_name }}"
        state: absent

    - name: Install fallback driver version
      ansible.builtin.zypper:
        name: "{{ package_name }}={{ fallback_driver_version }}"
        state: present
        disable_gpg_check: true

    - name: Install fallback compute-utils
      ansible.builtin.zypper:
        name: "nvidia-compute-utils-G07={{ fallback_driver_version }}"
        state: present
        disable_gpg_check: true

    - name: Install fallback nvidia-gl-G07
      ansible.builtin.zypper:
        name: "nvidia-gl-G07={{ fallback_driver_version }}"
        state: present
        disable_gpg_check: true

  when:
    - nvidia_install.stdout is defined
    - "'No provider of' in nvidia_install.stdout"
    - has_gpu | default(false)

- name: Mark reboot required
  set_fact:
    reboot_required: true
  when:
    - suse_packages | length > 0
    - rpm_check.rc != 0
